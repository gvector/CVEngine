[project]
name = "cvengine"
version = "0.1.0"
description = "Intelligent CV processing and employee matching system with vector search and agentic ranking"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "ollama>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "docx2txt>=0.8",
    "pypdf>=4.0",
    "rich>=13.7",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cvengine = "cvengine.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvengine"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"src/cvengine/cli/main.py" = ["B008"]  # typer.Argument/Option in defaults is idiomatic

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"